name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]
    schedule:
        - cron: '0 20 * * 0-4' # 20:00 UTC Sun-Thu = 02:00 Mon-Fri Bishkek
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup .NET
            uses: actions/setup-dotnet@v4
            with:
                dotnet-version: 8.0.x

          - name: Restore
            run: dotnet restore

          - name: Build
            run: dotnet build --no-restore

          - name: Test
            run: dotnet test --no-build --logger "trx;LogFileName=test-result.trx" --results-directory ./TestResults

          - name: Upload test results
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: test-results
                path: TestResults/*.trx